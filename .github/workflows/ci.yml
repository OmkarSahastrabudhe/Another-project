name: build-test
on:
  push:
    branches:
      - master
    
  
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: downloading-dependencies
        run: npm ci
      - name: test
        run:  | 
          npm test
          echo "test completed successfully"
  build: 
    needs: test 
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: downloading-dependencies
        run: npm ci
      - name: build
        run: |
          npm run build
          echo "build completed successfully"
      - name: upload-artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact 
          path: ./dist